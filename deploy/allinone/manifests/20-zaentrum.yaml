apiVersion: zaentrum.io/v1alpha1
kind: Zaentrum
metadata:
  name: zaentrum
  namespace: zaentrum
spec:
  channel: edge
  version: latest
  hostname: zaentrum.localhost
  identity:
    mode: bundled
    clientId: chino-web
    audience: chino
  storage:
    mediaSize: 50Gi
  features:
    gpu: false
    kafka: true
    # The media pipeline makes the library's titles playable on every client:
    # analyzed, prepared and packaged as HLS beside the library.
    pipeline: true
  pipeline:
    # On this machine's CPU, no GPU needed. HEVC Main or Main 10 (4:2:0, up to
    # 10-bit) and browser-friendly H.264 sources pass through, which is a remux;
    # anything else is an x265 encode, hours a title.
    encoder: cpu
  # One packager is plenty for one machine (the chart's default is two).
  replicas:
    packager: 1
  update:
    mode: manual
