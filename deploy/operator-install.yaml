apiVersion: v1
kind: ServiceAccount
metadata:
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zaentrum-operator-leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
