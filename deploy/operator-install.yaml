apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: zaentrums.zaentrum.io
spec:
  group: zaentrum.io
  names:
    kind: Zaentrum
    listKind: ZaentrumList
    plural: zaentrums
    shortNames:
    - stb
    singular: zaentrum
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.currentVersion
      name: Version
      type: string
    - jsonPath: .status.verification.result
      name: Verified
      type: string
    - jsonPath: .spec.hostname
      name: Host
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Zaentrum is the Schema for the zaentrums API; one CR drives the
          whole platform.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ZaentrumSpec defines the desired state of a Zaentrum platform
              instance.
            properties:
              backup:
                description: Backup configures backups of the bundled Postgres.
                properties:
                  claimName:
                    description: |-
                      ClaimName names an existing claim to keep the dumps on instead — one kept
                      from an earlier install, to restore from; none is created then.
                    type: string
                  className:
                    description: |-
                      ClassName is that claim's StorageClass. Empty: the bundled Postgres's —
                      storage.postgres.className, else storage.className, else the cluster's
                      default.
                    type: string
                  enabled:
                    description: |-
                      Enabled runs the backups. Unset: on wherever the bundled Postgres keeps its
                      data on a claim — a new install — and off where it still runs on an
                      emptyDir, which spec.storage.postgres.migrate moves onto a claim.
                    type: boolean
                  retention:
                    description: |-
                      Retention is how many dumps are kept, newest first: once a backup is
                      complete, older dumps beyond it are removed. Default 7.
                    format: int32
                    minimum: 1
                    type: integer
                  schedule:
                    description: |-
                      Schedule is when a backup runs, as a CronJob schedule in the time zone of
                      the cluster's controller manager. Default "@daily", at midnight.
                    type: string
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Size of the claim backups, ReadWriteOnce. Default
                      5Gi.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              channel:
                default: stable
                description: Channel selects the release train (consumed by Stage-2
                  auto-update).
                enum:
                - stable
                - edge
                type: string
              databases:
                description: Databases configures the per-app database layout.
                properties:
                  chino:
                    default: chino
                    type: string
                  external:
                    description: External configures the shared database cluster
                      used when Mode is "external".
                    properties:
                      host:
                        description: Host of the shared cluster, e.g. postgres.example.com.
                        type: string
                      port:
                        default: 5432
                        format: int32
                        type: integer
                      sslmode:
                        default: require
                        type: string
                    type: object
                  katalog:
                    default: katalog
                    type: string
                  keycloak:
                    default: keycloak
                    type: string
                  mode:
                    default: perApp
                    description: Mode is "perApp" (a DB per service), "single",
                      or "external" (shared cluster).
                    type: string
                  portal:
                    default: portal
                    type: string
                type: object
              eventStreaming:
                description: EventStreaming selects the bundled broker or a shared
                  external Kafka.
                properties:
                  bootstrap:
                    description: Bootstrap is the external bootstrap server list.
                    type: string
                  certSecret:
                    description: CertSecret names a secret in this namespace with
                      user.crt/user.key/ca.crt for mTLS; empty = plaintext.
                    type: string
                  mode:
                    default: bundled
                    enum:
                    - bundled
                    - external
                    type: string
                  topicPrefix:
                    default: stube.
                    description: TopicPrefix is the per-tenant topic namespace on
                      a shared cluster (e.g. "zaentrum-beta.").
                    type: string
                type: object
              features:
                description: Features toggles optional capabilities.
                properties:
                  gpu:
                    default: false
                    description: GPU enables hardware (NVENC) transcoding on the stream
                      plane.
                    type: boolean
                  kafka:
                    default: true
                    description: Kafka enables the bundled single-node event-stream
                      broker.
                    type: boolean
                  pipeline:
                    default: false
                    description: Pipeline enables the media pipeline (analyzer/packager/transcoder/katalog-ingest).
                    type: boolean
                type: object
              hostname:
                default: zaentrum.localhost
                description: 'Hostname is the public host: issuer host + ingress host
                  + KC_HOSTNAME.'
                type: string
              identity:
                description: Identity configures the OIDC provider.
                properties:
                  audience:
                    default: chino
                    description: Audience is the expected token audience services
                      validate against.
                    type: string
                  clientId:
                    default: chino-web
                    description: ClientID is the public OIDC client id the web SPA
                      authenticates as.
                    type: string
                  exposeAdminConsole:
                    description: |-
                      ExposeAdminConsole publishes the bundled Keycloak's admin console and its
                      admin API on the public host, under /auth/admin. Off by default: the
                      public host then routes only what people sign in through — /auth/realms
                      (the login and account pages, the OIDC endpoints) and /auth/resources —
                      and the console answers only through a port-forward, at
                      http://localhost:8080/auth/admin/ after
                      `kubectl port-forward svc/keycloak 8080:80`.
                    type: boolean
                  issuer:
                    description: |-
                      Issuer is the public OIDC issuer URL. When empty in bundled mode the
                      operator derives it from Hostname (http://<hostname>/auth/realms/zaentrum).
                    type: string
                  issuerScheme:
                    default: http
                    description: |-
                      IssuerScheme is http or https — the scheme of the derived issuer + the
                      bundled Keycloak KC_HOSTNAME. Use https when TLS is terminated at the edge.
                      With spec.tls it is https whatever this says.
                    enum:
                    - http
                    - https
                    type: string
                  loginTheme:
                    description: LoginTheme is the bundled Keycloak login theme name
                      (empty = Keycloak default).
                    type: string
                  mobileClientId:
                    description: |-
                      MobileClientID is the public client the phone and tablet apps sign in
                      through: the authorization code with PKCE (S256) in the system browser,
                      returning to cloud.nalet.chino:/oauth/callback exactly; chino-api
                      advertises it in /api/config. Empty: the bundled realm's chino-mobile
                      with bundled identity, and with an external one chino-api's own default,
                      "chino".
                    type: string
                  mode:
                    default: bundled
                    description: Mode is "bundled" (ship Keycloak) or "external" (federate).
                    enum:
                    - bundled
                    - external
                    type: string
                  tvClientId:
                    description: |-
                      TVClientID is the public client the TV apps sign in through, with the
                      device authorization grant and PKCE (S256); chino-api advertises it in
                      /api/config. Empty: the bundled realm's chino-tv with bundled identity,
                      and with an external one chino-api's own default, "chino".
                    type: string
                type: object
              imagePullSecrets:
                description: ImagePullSecrets are added to every workload (private
                  registries).
                items:
                  type: string
                type: array
              keycloak:
                description: Keycloak configures the bundled Keycloak image.
                properties:
                  image:
                    default: quay.io/keycloak/keycloak:26.0.7
                    description: Image is the bundled Keycloak container image.
                    type: string
                type: object
              network:
                description: Network configures split-horizon / hostAliases.
                properties:
                  issuerHostAliasIP:
                    description: |-
                      IssuerHostAliasIP adds a hostAliases entry (this IP → the public host) to
                      the OIDC validators so in-cluster token validation reaches an edge-terminated
                      HTTPS issuer (split-horizon). Empty = no hostAliases.
                    type: string
                type: object
              partOf:
                description: 'PartOf sets the app.kubernetes.io/part-of label value
                  (default: the namespace).'
                type: string
              pipeline:
                description: Pipeline configures the media pipeline features.pipeline
                  turns on.
                properties:
                  encoder:
                    description: |-
                      Encoder is where the transcoder encodes. gpu, the default: NVENC, so the
                      transcoder asks for an NVIDIA GPU (nvidia.com/gpu) and is placed on a node
                      that has one. cpu: libx264 and libx265 on any node, no GPU asked for. HEVC
                      every device decodes (Main or Main 10, 4:2:0, up to 10-bit) is passed
                      through either way. On the CPU, H.264 a browser decodes (8-bit 4:2:0, up
                      to High) is passed through too unless the ladder is "source:hevc", and
                      anything else costs an x265 encode, which takes hours a title.
                    enum:
                    - gpu
                    - cpu
                    type: string
                  extraLadder:
                    description: |-
                      ExtraLadder is the ladder for a title's extras (trailers, featurettes)
                      (EXTRA_LADDER); empty: the transcoder's default, 720p and 480p H.264.
                      "source:hevc" packages extras like titles, HEVC only.
                    pattern: ^(source|[0-9]{3,4}p)(:(hevc|h264|[0-9]+(\.[0-9]+)?[kKmM]))*(,
                      ?(source|[0-9]{3,4}p)(:(hevc|h264|[0-9]+(\.[0-9]+)?[kKmM]))*)*$
                    type: string
                  hlsSubtitles:
                    description: |-
                      HLSSubtitles names the WebVTT subtitle renditions in the HLS master
                      playlist (the packager's HLS_SUBTITLES). Default false: the clients draw
                      the subtitle sidecars themselves.
                    type: boolean
                  ladder:
                    description: |-
                      Ladder adds renditions per title (the transcoder's LADDER): rungs
                      separated by commas, each source or a height such as 720p, optionally
                      with a codec (hevc, h264) and a maxrate (2500k, 3M), e.g. "source,720p".
                      "source:hevc" is HEVC only: one rendition at the source's size, on a CPU
                      too. Every rung is stored beside the library. Empty: one rendition a title.
                    pattern: ^(source|[0-9]{3,4}p)(:(hevc|h264|[0-9]+(\.[0-9]+)?[kKmM]))*(,
                      ?(source|[0-9]{3,4}p)(:(hevc|h264|[0-9]+(\.[0-9]+)?[kKmM]))*)*$
                    type: string
                  preferredLanguages:
                    description: |-
                      PreferredLanguages orders which audio language is the default, e.g.
                      [de, en] (the packager's PREFERRED_LANGUAGES). Empty: the order of the
                      catalog's language list.
                    items:
                      type: string
                    type: array
                  segmentSeconds:
                    description: |-
                      SegmentSeconds is the length of an HLS segment, and so the transcoder's
                      keyframe interval: SEGMENT_SECONDS of both workers. Empty: theirs, 6.
                    format: int32
                    maximum: 30
                    minimum: 1
                    type: integer
                  surroundAudio:
                    description: |-
                      SurroundAudio adds a 5.1 rendition of each surround track beside its
                      stereo one (the packager's SURROUND_AUDIO): off, eac3 or ac3. Empty: off.
                      Leave it off until chino-stream keeps it from players that cannot decode
                      it.
                    enum:
                    - "off"
                    - eac3
                    - ac3
                    type: string
                type: object
              replicas:
                additionalProperties:
                  format: int32
                  type: integer
                description: |-
                  Replicas overrides the replica count of individual app-tier Deployments by
                  name, e.g. {"chino-api": 2, "katalog-api": 3}. Unlisted services stay at 1.
                  Stateful backers (postgres/valkey/kafka/keycloak) are NOT scalable this way.
                  Set from the portal operator console; the operator reconciles it so the
                  change persists (a raw Deployment edit would be reverted on the next pass).
                type: object
              routing:
                description: Routing selects Ingress vs OpenShift Routes.
                properties:
                  hosts:
                    description: Hosts names the per-product public hosts used in
                      subdomains mode.
                    properties:
                      chino:
                        description: Chino is the host serving the chino SPA at
                          "/", e.g. chino.example.com.
                        type: string
                    type: object
                  mode:
                    default: pathRouted
                    description: Mode is "pathRouted" (everything on Hostname) or
                      "subdomains" (chino gets its own host; additive).
                    enum:
                    - pathRouted
                    - subdomains
                    type: string
                  provisionIngress:
                    description: ProvisionIngress renders a plain-Kubernetes Ingress.
                      Default true.
                    type: boolean
                  provisionRoutes:
                    description: ProvisionRoutes renders OpenShift Routes (single-origin
                      paths). Default false.
                    type: boolean
                type: object
              secrets:
                description: |-
                  Secrets says whether the platform's Secrets are the operator's to make or
                  provided from outside.
                properties:
                  external:
                    description: |-
                      External means the platform's Secrets are pre-created (e.g. by CI) and
                      left alone. Default false: the operator generates each one it needs once,
                      from crypto/rand, owns it and never rotates it — zaentrum-db,
                      zaentrum-stream-signing and, with bundled identity, zaentrum-keycloak,
                      zaentrum-keycloak-admin and zaentrum-demo-user.
                    type: boolean
                type: object
              storage:
                description: Storage configures persistent storage.
                properties:
                  className:
                    description: ClassName is an optional StorageClass for all platform
                      PVCs.
                    type: string
                  kafkaNode:
                    description: |-
                      KafkaNode pins the bundled Kafka broker to a node (kubernetes.io/hostname),
                      required when KafkaPVC is a node-local volume. Empty → no node pinning.
                    type: string
                  kafkaPvc:
                    description: |-
                      KafkaPVC names a pre-created PVC to back the bundled Kafka broker's log dir
                      so topics survive a pod restart/reschedule. Empty (default) → ephemeral
                      emptyDir (topics are recreated by the demo's topics Job + producer retry).
                    type: string
                  mediaAccessMode:
                    description: |-
                      MediaAccessMode is the access mode of the media PVC the chart creates
                      (provisionMedia). ReadWriteOnce, the default, suits a single node and
                      node-local storage such as k3s's local-path, where every pod that mounts
                      the library runs on the volume's node; ReadWriteMany is for a cluster
                      whose storage class shares one volume across nodes (NFS, CephFS).
                    enum:
                    - ReadWriteOnce
                    - ReadWriteMany
                    type: string
                  mediaSize:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 50Gi
                    description: MediaSize is the size of the media library PVC.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  postgres:
                    description: |-
                      Postgres is the volume of the bundled Postgres (databases.mode perApp or
                      single): a PersistentVolumeClaim, so users, watch state and the catalog
                      outlive the pod. An install whose Postgres already runs on emptyDir stays
                      there until Migrate copies its databases over.
                    properties:
                      claimName:
                        description: |-
                          ClaimName names an existing PersistentVolumeClaim to keep the data on
                          instead; none is created then.
                        type: string
                      className:
                        description: |-
                          ClassName is the StorageClass of that claim. Empty: storage.className,
                          else the cluster's default.
                        type: string
                      migrate:
                        description: |-
                          Migrate moves a database that lives anywhere else — on emptyDir, where
                          the bundled Postgres kept it before it was persistent, or on another
                          claim — onto the claim above: a Job copies every database into it from
                          the running Postgres, and only once the copy has succeeded does the
                          Postgres switch over. Without it the operator never moves the database,
                          since a Postgres started on a new volume starts empty.
                        type: boolean
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 10Gi
                        description: Size of the claim created for it, postgres-data.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  provisionMedia:
                    description: |-
                      ProvisionMedia controls whether the chart creates the media PVC. Set false
                      when an external PV backs it (e.g. the demo's NFS export). Default true.
                    type: boolean
                type: object
              tls:
                description: |-
                  TLS serves the hosts over https with a certificate of the platform's own:
                  a Secret, or one cert-manager issues. Unset: the platform serves plain
                  http, unless TLS is terminated in front of it (identity.issuerScheme
                  https) or by the OpenShift router (routing.provisionRoutes).
                properties:
                  issuerRef:
                    description: |-
                      IssuerRef names the cert-manager Issuer or ClusterIssuer that signs a
                      Certificate for those hosts into SecretName. It takes cert-manager's CRDs
                      in the cluster; without them nothing is issued, and the TLS condition says
                      so.
                    properties:
                      group:
                        description: |-
                          Group is the issuer's API group, for an external issuer. Default
                          cert-manager.io.
                        type: string
                      kind:
                        description: Kind is Issuer or ClusterIssuer. Default Issuer.
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        description: Name of the Issuer (in the platform's namespace)
                          or ClusterIssuer.
                        type: string
                    required:
                    - name
                    type: object
                  secretName:
                    description: |-
                      SecretName is a kubernetes.io/tls Secret in the platform's namespace, with
                      tls.crt (the certificate and its chain) and tls.key, for hostname and, in
                      subdomains routing, routing.hosts.chino. Bring it, or let cert-manager
                      write it (IssuerRef). Default zaentrum-tls.
                    type: string
                type: object
              update:
                description: Update configures Stage-2 auto-update.
                properties:
                  mode:
                    default: manual
                    description: Mode is "manual" (default) or "auto".
                    enum:
                    - manual
                    - auto
                    type: string
                type: object
              verification:
                description: Verification configures the platform's self-test after
                  each update.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled runs the checks after every update that leaves the platform
                      Ready, and whenever the zaentrum.io/verify-request annotation changes.
                      Default true.
                    type: boolean
                type: object
              version:
                default: latest
                description: Version is the image tag applied to every ghcr.io/zaentrum/*
                  image.
                type: string
            type: object
          status:
            description: ZaentrumStatus reports the observed state of a Zaentrum platform
              instance.
            properties:
              availableUpdate:
                description: |-
                  AvailableUpdate is the newest in-channel tag discovered by Stage-2
                  auto-update logic, if any.
                type: string
              backup:
                description: |-
                  Backup reports the bundled Postgres's backups and the latest restore.
                  Absent with external databases.
                properties:
                  dumps:
                    description: |-
                      Dumps are the dumps on the claim, newest first, as the latest backup that
                      succeeded left them.
                    items:
                      type: string
                    type: array
                  job:
                    description: Job is the latest backup's Job.
                    type: string
                  lastDump:
                    description: 'LastDump is the dump that backup wrote: the name
                      to restore it by.'
                    type: string
                  lastFailure:
                    description: |-
                      LastFailure is when the latest backup that failed ended; the Backup
                      condition says why while it is the latest backup.
                    format: date-time
                    type: string
                  lastSuccess:
                    description: LastSuccess is when the latest backup that succeeded
                      ended.
                    format: date-time
                    type: string
                  restore:
                    description: |-
                      Restore is the latest restore the zaentrum.io/restore-request annotation
                      asked for.
                    properties:
                      finishedAt:
                        description: FinishedAt is when it ended.
                        format: date-time
                        type: string
                      job:
                        description: Job is the restore's Job.
                        type: string
                      message:
                        description: Message is what was restored, or why not.
                        type: string
                      request:
                        description: |-
                          Request is the zaentrum.io/restore-request value — the dump's name — this
                          restore answers.
                        type: string
                      result:
                        description: Result is Stopping, Running, Succeeded, Failed
                          or Refused.
                        enum:
                        - Stopping
                        - Running
                        - Succeeded
                        - Failed
                        - Refused
                        type: string
                      startedAt:
                        description: StartedAt is when the restore was asked for and
                          the clients began to stop.
                        format: date-time
                        type: string
                    required:
                    - request
                    - result
                    type: object
                type: object
              components:
                description: Components reports per-Deployment readiness.
                items:
                  description: ComponentStatus reports the readiness of one managed
                    Deployment.
                  properties:
                    image:
                      description: Image is the primary container image (with tag)
                        currently applied.
                      type: string
                    name:
                      description: Name is the Deployment name.
                      type: string
                    ready:
                      description: Ready is true when all replicas of the Deployment
                        are available.
                      type: boolean
                  required:
                  - name
                  - ready
                  type: object
                type: array
              conditions:
                description: Conditions follow the standard Kubernetes condition convention.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              controller:
                description: |-
                  Controller reports the operator's own controller — what it runs, how it
                  was installed and whether something newer is out. Reported, never acted
                  on. Absent until a controller that knows how to read itself reconciles
                  the CR.
                properties:
                  availableUpdate:
                    description: |-
                      AvailableUpdate is a newer controller version discovered on the CR's
                      channel. Empty when there is none, when spec.version pins a tag (the CR
                      has opted out of channel tracking entirely), or when discovery failed.
                    type: string
                  image:
                    description: |-
                      Image is the image the controller pod actually runs, exactly as written
                      (a tag, a digest, or both). Empty when the pod could not be read.
                    type: string
                  observedAt:
                    description: |-
                      ObservedAt is when this reading last CHANGED — not when it was last
                      taken. The reading is retaken every pass; the timestamp moves only when
                      something about it does (see internal/controller/self.go for why).
                    format: date-time
                    type: string
                  source:
                    description: Source is how this controller was installed.
                    enum:
                    - olm
                    - manifest
                    - appliance
                    - unknown
                    type: string
                  version:
                    description: |-
                      Version is the image's tag when it has one, else its short (12 hex
                      character) digest, else "unknown".
                    type: string
                required:
                - availableUpdate
                - image
                - observedAt
                - source
                - version
                type: object
              currentVersion:
                description: CurrentVersion mirrors the version most recently applied
                  to the cluster.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse human-facing lifecycle string.
                type: string
              verification:
                description: |-
                  Verification reports the platform's latest self-test. Absent until the
                  first run; see VerificationStatus.
                properties:
                  checks:
                    description: |-
                      Checks are the report's lines, at most 40; when there are more, failures
                      and warnings are kept first and message says how many are not shown.
                    items:
                      description: VerificationCheck is one line of the run's report.
                      properties:
                        detail:
                          description: Detail is what the check saw, at most 200 characters.
                          type: string
                        name:
                          description: Name of the check, as the check runner names
                            it.
                          type: string
                        status:
                          description: Status is ok, warn, fail or skip.
                          enum:
                          - ok
                          - warn
                          - fail
                          - skip
                          type: string
                      required:
                      - name
                      - status
                      type: object
                    type: array
                  failed:
                    description: Failed counts the report's checks that failed.
                    format: int32
                    type: integer
                  fingerprint:
                    description: |-
                      Fingerprint identifies the platform the run verified: the first 12 hex
                      characters of the sha256 over the sorted "deployment/container=image"
                      lines of every platform Deployment (init containers included), images as
                      applied after digest pinning. A run starts whenever it moves.
                    type: string
                  finishedAt:
                    description: FinishedAt is when the run ended.
                    format: date-time
                    type: string
                  job:
                    description: Job is the name of the run's Job, in the platform's
                      namespace.
                    type: string
                  message:
                    description: 'Message is one line about the result: a summary,
                      or why there is none.'
                    type: string
                  passed:
                    description: Passed counts the report's checks that passed.
                    format: int32
                    type: integer
                  request:
                    description: Request is the zaentrum.io/verify-request value the
                      run answered.
                    type: string
                  result:
                    description: Result is Passed, Failed, Running, Skipped or Error.
                    enum:
                    - Passed
                    - Failed
                    - Running
                    - Skipped
                    - Error
                    type: string
                  skipped:
                    description: Skipped counts the report's checks that did not run.
                    format: int32
                    type: integer
                  startedAt:
                    description: StartedAt is when the run started.
                    format: date-time
                    type: string
                  trigger:
                    description: 'Trigger is what started the run: update or request.'
                    enum:
                    - update
                    - request
                    type: string
                  version:
                    description: Version is status.currentVersion when the run started.
                    type: string
                  warned:
                    description: Warned counts the report's checks that passed with
                      a warning.
                    format: int32
                    type: integer
                required:
                - failed
                - passed
                - result
                - skipped
                - warned
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zaentrum-operator-leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zaentrum-operator-manager-role
rules:
  # The Zaentrum CR itself + status/finalizers.
  - apiGroups: ["zaentrum.io"]
    resources: ["zaentrums"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["zaentrum.io"]
    resources: ["zaentrums/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["zaentrum.io"]
    resources: ["zaentrums/finalizers"]
    verbs: ["update"]
  # ZaentrumAddon — addon Helm charts the operator installs next to the
  # platform. The full verb set is also what the operator grants portal-api
  # (the settings wizard creates, updates and removes addons), and a grantor
  # must hold what it grants. finalizers/update lets applied objects carry a
  # blocking owner reference to their addon.
  - apiGroups: ["zaentrum.io"]
    resources: ["zaentrumaddons"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["zaentrum.io"]
    resources: ["zaentrumaddons/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["zaentrum.io"]
    resources: ["zaentrumaddons/finalizers"]
    verbs: ["update"]
  # Namespace (cluster-scoped) — created/owned by the operator.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Core namespaced kinds rendered by the templates and by addon charts.
  # Addons may render exactly these kinds plus Deployments and Jobs.
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
      - serviceaccounts
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workloads. Jobs are also the platform's self-test: the operator creates one
  # Job per verification run, reads it, and deletes the previous run's. Secrets
  # (above) include the test account's, zaentrum-verify, which the operator
  # creates and fills in.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The backups of the bundled Postgres: the chart's CronJob, which the operator
  # applies, and removes when backups are turned off.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The platform's certificate from cert-manager (spec.tls.issuerRef): the
  # chart's Certificate, which the operator applies and reads the readiness of.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Ingress (plain-Kubernetes exposure; provisionIngress profiles).
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OpenShift Routes (single-origin exposure; provisionRoutes profiles, e.g. the
  # demo). Without this the SSA apply of the rendered Routes is forbidden.
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Setting a Route's spec.host requires the custom-host sub-resource (OpenShift
  # RBAC) — needed to CREATE a route with an explicit host (adopting an existing
  # route with an unchanged host does not trip this, so it only surfaces on a new route).
  - apiGroups: ["route.openshift.io"]
    resources: ["routes/custom-host"]
    verbs: ["create", "update"]
  # RBAC the operator hands to katalog-manager-api (first-run config propagation).
  # A controller may only grant rights it already holds, so it must carry these.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Held so the operator may GRANT them to the portal-api Role (operator
  # console: list/scale/restart deployments, read pod status + logs). The RBAC
  # escalation check compares the granted rules against the grantor's on Role
  # CREATE — a fresh namespace fails without these even though the demo (whose
  # Role pre-existed with identical rules) reconciles fine. The addon
  # controller also lists pods, to say why an addon component is not ready.
  #
  # pods/get and (above) deployments/get are ALSO how the operator reports its
  # own controller in status.controller: it reads the pod named by the downward
  # API and, for an OLM install, the Deployment that a ClusterServiceVersion
  # owns. That needs nothing this role did not already hold — deliberately: a
  # report about the operator is not worth widening the operator's reach, which
  # is also why the Deployment name is derived from the pod's ReplicaSet owner
  # instead of adding a replicasets rule to read it.
  #
  # pods/list is how verification reads a run's result: the termination message
  # of the run Job's pod. Read uncached, so no pod watch is needed.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zaentrum-operator-leader-election-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zaentrum-operator-leader-election-role
subjects:
- kind: ServiceAccount
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zaentrum-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zaentrum-operator-manager-role
subjects:
- kind: ServiceAccount
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/part-of: zaentrum-operator
    control-plane: controller-manager
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        command:
        - /manager
        # Downward API: the operator reads its own pod to report what this
        # controller runs in status.controller (never a build-time constant).
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: ghcr.io/zaentrum/operator:sha-4792db21e0b91c6269a06671d5114d06ade2d61d
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8080
          name: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: zaentrum-operator-controller-manager
      terminationGracePeriodSeconds: 10
