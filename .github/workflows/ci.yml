name: ci

on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  # The public boundary the open-source strategy calls "enforced, not trusted".
  # It was neither until 2026-08-06, when the published operator image was found
  # to carry three internal hostnames, compiled in via the chart templates the
  # binary embeds. Nothing checked.
  #
  # (This comment used to name those hostnames, and the guard failed the commit
  #  that added it — correctly. Even describing the problem counts as carrying
  #  it.)
  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-neutrality.sh

  # The operator's own tests, and the chart it embeds. The image's build
  # compiles the operator and runs neither.
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The newest 1.24, as the image's golang:1.24 has it. go.mod names
          # 1.24.0, and a test of the proxy's parsing fails on 1.24.0 only.
          go-version: '1.24'
          cache-dependency-path: operator/go.sum
      - uses: azure/setup-helm@v5
      - name: go vet
        working-directory: operator
        run: go vet ./...
      - name: go test
        working-directory: operator
        run: go test ./...
      - name: helm lint
        run: helm lint operator/platform/chart
      # The appliance's manifests are committed: a render of this tree must
      # leave them as they are.
      - name: the appliance's manifests, as a render makes them
        run: ./deploy/allinone/build.sh render && git diff --exit-code -- deploy/allinone/manifests

  # kind's real job: smoke-test that the manifests apply on a throwaway
  # vanilla cluster (NOT a runtime — see docs/architecture.md).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The base ships no credentials and refuses to build without them:
      # make random ones for this throwaway cluster.
      - name: kustomize build (base + demo)
        run: |
          ./deploy/base/make-secrets.sh
          kubectl kustomize deploy/base   > /tmp/base.yaml
          kubectl kustomize deploy/overlays/demo > /tmp/demo.yaml
          echo "rendered $(grep -c '^kind:' /tmp/base.yaml) base resources"
      - uses: helm/kind-action@v1
        with: { cluster_name: zaentrum-ci }
      - name: apply base on kind
        run: |
          kubectl apply -k deploy/base --dry-run=server || \
          kubectl apply -k deploy/base   # images may be private until first release
          kubectl -n zaentrum get all

  # The platform-owned images (apps/admin, platform/keycloak, operator) are built
  # + pushed by .github/workflows/build-images.yml; the all-in-one bundle by
  # .github/workflows/all-in-one.yml. The service/client images are built by their
  # own repos at github.com/zaentrum/<svc> (this meta-repo only references them).
  # This job stays focused on the manifest smoke test.
