# Build the Zaentrum all-in-one image and push it to GitHub Container Registry.
#
# The all-in-one bundles a single-node k3s (FROM rancher/k3s), the operator's
# install and a Zaentrum, so `docker run` installs a whole Zaentrum cluster in one
# container. It is published as:
#   ghcr.io/zaentrum/appliance:latest
#   ghcr.io/zaentrum/appliance:<git-sha>
# and, from a release tag vX.Y.Z, as :vX.Y.Z and :X.Y (no :X.Y for a
# pre-release) — never as :latest. A release's appliance bakes operator:vX.Y.Z
# and a Zaentrum pinned to vX.Y.Z (deploy/allinone/build.sh, VERSION); main's
# bakes operator:latest and a Zaentrum on the edge channel.
#
# It chains off build-images: once the component images exist for a commit on
# main, this assembles the bundle that references them. It can also be run by
# hand (workflow_dispatch) and on direct pushes to main that touch the bundle.
# A release tag runs it directly; its boot waits for the release's images,
# which every repository of the platform builds from its own tag.
name: all-in-one

on:
  # Run after the component images finish building on the default branch.
  workflow_run:
    workflows: [build-images]
    types: [completed]
    branches: [main]
  # Also (re)build when the bundle itself changes on main.
  push:
    branches: [main]
    # A release. A tag push ignores the paths below.
    tags: ['v*.*.*']
    paths:
      - 'deploy/allinone/**'
      - 'operator/config/**'
      - '.github/workflows/all-in-one.yml'
  # Manual trigger from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  # id-token: the workflow's own identity, which signs what it builds:
  # there is no key to keep.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/zaentrum/appliance

concurrency:
  group: all-in-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # When triggered by workflow_run, only proceed if build-images succeeded.
    # The push / workflow_dispatch triggers carry no workflow_run payload, so
    # the conclusion field is empty and the second clause lets them through.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # Write deploy/allinone/manifests from operator/config (the operator's
      # install and the sample Zaentrum) so the k3s auto-apply dir is populated
      # before the docker build COPYs it in.
      - name: Render manifests
        env:
          # A release's tag pins the operator and the platform to it.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./deploy/allinone/build.sh render

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=false: a semver tag would otherwise add :latest by itself.
          # A release's appliance is never :latest, nor a :sha- one.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type != 'tag' }}
            type=sha,format=long,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{raw}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push all-in-one
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/allinone
          file: deploy/allinone/Dockerfile
          push: true
          # amd64 today. arm64 is a future matrix axis — add it here once the
          # component images publish arm64 too:
          #   platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build's own record (which repository, which commit, which
          # workflow) and the list of the packages the image holds, attached
          # to the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=all-in-one
          cache-to: type=gha,mode=max,scope=all-in-one

      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign the all-in-one image, by its digest
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  boot:
    # Building the image says nothing about whether it runs. Boot it as a user
    # would — `docker run --privileged -p 80:80` — and wait for the platform to
    # check itself: k3s comes up, the operator reconciles the Zaentrum, every
    # component turns ready, and the platform's own verification (the chart test:
    # zae doctor --sign-in, as its test account, through the appliance's ingress)
    # must pass. The appliance once could not create its Keycloak Service at all;
    # only a boot shows that.
    needs: build
    # main's appliance runs the operator's :latest. Only the run that follows
    # build-images (or a manual one) is sure that :latest is this commit's; a
    # push-triggered run may race the operator build and boot yesterday's.
    # build-images runs on every push to main, so every push is booted anyway.
    # A release's appliance names its own tags, so its run boots it — once
    # every image of the release is published.
    if: github.event_name != 'push' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APPLIANCE: ${{ github.ref_type == 'tag' && format('ghcr.io/zaentrum/appliance:{0}', github.ref_name) || format('ghcr.io/zaentrum/appliance:sha-{0}', github.sha) }}
    steps:
      # The release's scripts below, and the memory sampler on every boot.
      - uses: actions/checkout@v4

      # Every repository builds its own images from the release's tag; the
      # appliance pulls them as its pods start. Booting before they exist
      # measures the race, not the release.
      - name: Wait for the release's images
        if: github.ref_type == 'tag'
        timeout-minutes: 45
        run: ./scripts/wait-for-images.sh "$GITHUB_REF_NAME"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Boot the appliance
        run: docker run -d --name zaentrum --privileged -p 80:80 "$APPLIANCE"

      # What the identity provider's pod is charged for, once a second, from
      # the moment it exists until the platform is Ready: its cgroup and each
      # of its containers', memory.current and memory.stat's fields. The
      # runner's memory and the appliance's own limit first.
      - name: Sample the identity provider's memory
        run: |
          free -m
          echo "the appliance's memory limit (0: none): $(docker inspect zaentrum --format '{{.HostConfig.Memory}}')"
          nohup ./scripts/allinone-memory.sh sample "$RUNNER_TEMP/keycloak-memory.txt" > "$RUNNER_TEMP/sampler.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sampler.pid"

      - name: Wait for the platform to be Ready
        run: |
          k() { docker exec zaentrum kubectl "$@"; }
          for i in $(seq 1 150); do
            phase=$(k -n zaentrum get zaentrum zaentrum -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = Ready ] && { echo "Ready after $((i * 10))s"; exit 0; }
            [ $((i % 6)) -eq 0 ] && echo "$((i * 10))s: phase=${phase:-none}"
            sleep 10
          done
          echo "::error::the platform did not become Ready in 25 minutes"
          exit 1

      - name: What the identity provider's pod was charged for
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/sampler.pid" 2>/dev/null)" 2>/dev/null || true
          ./scripts/allinone-memory.sh report "$RUNNER_TEMP/keycloak-memory.txt" || true
          tail -5 "$RUNNER_TEMP/sampler.log" 2>/dev/null || true

      - name: Keep the samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-memory
          path: ${{ runner.temp }}/keycloak-memory.txt
          if-no-files-found: ignore

      - name: Wait for the platform's verification of itself
        run: |
          k() { docker exec zaentrum kubectl "$@"; }
          for _ in $(seq 1 90); do
            result=$(k -n zaentrum get zaentrum zaentrum -o jsonpath='{.status.verification.result}' 2>/dev/null || true)
            case "$result" in Passed|Failed|Error|Skipped) break ;; esac
            sleep 10
          done
          k -n zaentrum get zaentrum zaentrum -o jsonpath='{range .status.verification.checks[*]}{.status}{"\t"}{.name}{"\t"}{.detail}{"\n"}{end}'
          echo "result: ${result:-none} — $(k -n zaentrum get zaentrum zaentrum -o jsonpath='{.status.verification.message}')"
          [ "$result" = Passed ] || { echo "::error::the platform's verification is ${result:-missing}, not Passed"; exit 1; }

      - name: The web client answers from outside
        run: |
          for path in / /chino/ /portal/ /auth/realms/zaentrum/.well-known/openid-configuration; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --resolve zaentrum.localhost:80:127.0.0.1 "http://zaentrum.localhost$path")
            echo "$code $path"
            case "$code" in 2??|3??) ;; *) echo "::error::$path answered $code"; exit 1 ;; esac
          done

      - name: What the cluster looked like
        if: always()
        run: |
          k() { docker exec zaentrum kubectl "$@"; }
          k get pods -A -o wide || true
          k -n zaentrum get zaentrum zaentrum -o yaml | sed -n '/^status:/,$p' || true
          k -n zaentrum get events --sort-by=.lastTimestamp | tail -40 || true
          k -n zaentrum-operator-system logs deploy/zaentrum-operator-controller-manager --tail=80 || true
          for j in $(k -n zaentrum get jobs -l zaentrum.io/verification=run -o name 2>/dev/null); do
            k -n zaentrum logs "$j" --all-containers --tail=60 || true
          done
          # The realm job's own log: it writes the identity provider's realm.
          for j in $(k -n zaentrum get jobs -o name 2>/dev/null | grep -- '-realm' || true); do
            echo "::group::log of $j"
            k -n zaentrum logs "$j" --all-containers --tail=200 || true
            echo "::endgroup::"
          done
          # Every container that restarted: how its last run ended, its log from
          # before the restart (gone from a plain logs) and its pod's events.
          k get pods -A -o json | jq -r '.items[] | .metadata.namespace as $ns | .metadata.name as $pod
            | ((.status.initContainerStatuses // []) + (.status.containerStatuses // []))[]
            | select(.restartCount > 0)
            | [$ns, $pod, .name, .restartCount, (.lastState.terminated.exitCode // "-"),
               (.lastState.terminated.reason // "-"), (.lastState.terminated.finishedAt // "-")] | @tsv' \
            > "$RUNNER_TEMP/restarted.tsv" || true
          echo "Containers that restarted (namespace, pod, container, restarts, last exit code, reason, ended):"
          cat "$RUNNER_TEMP/restarted.tsv"
          while IFS=$'\t' read -r ns pod c _; do
            echo "::group::log before the restart of $ns/$pod/$c"
            k -n "$ns" logs "$pod" -c "$c" --previous --tail=200 || true
            k -n "$ns" describe pod "$pod" | sed -n '/^Events:/,$p' || true
            echo "::endgroup::"
          done < "$RUNNER_TEMP/restarted.tsv"
          # Keycloak's memory, from its pod's cgroup on the appliance: the pod's
          # memory.events counts every kill of its containers, restarts included,
          # and memory.peak is the most the pod and each container held.
          uid=$(k -n zaentrum get pods -l app=keycloak -o jsonpath='{.items[0].metadata.uid}' 2>/dev/null || true)
          if [ -n "$uid" ]; then
            echo "::group::keycloak's memory, from its pod's cgroup"
            docker exec zaentrum sh -c '
              for d in $(find /sys/fs/cgroup -type d \( -name "*pod$1*" -o -name "*pod$2*" \) 2>/dev/null); do
                for c in "$d" "$d"/*; do
                  [ -f "$c/memory.events" ] || continue
                  echo "$c"
                  sed "s/^/  /" "$c/memory.events"
                  echo "  peak $(cat "$c/memory.peak" 2>/dev/null || echo -) max $(cat "$c/memory.max" 2>/dev/null || echo -)"
                done
              done' sh "$uid" "${uid//-/_}" || true
            echo "::endgroup::"
            # Where what the pod writes is kept: its volumes (an emptyDir's
            # medium Memory is charged to the pod), and the filesystems of the
            # container's root, its data directory and the pod's emptyDirs.
            echo "::group::keycloak's volumes and filesystems"
            k -n zaentrum get pod -l app=keycloak -o json |
              jq -c '.items[0].spec.volumes[] | {name, emptyDir, configMap: .configMap.name, secret: .secret.secretName}' || true
            pod=$(k -n zaentrum get pods -l app=keycloak -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            k -n zaentrum exec "$pod" -c keycloak -- sh -c 'cat /proc/self/mounts | grep -E " (/|/opt/keycloak[^ ]*|/tmp) "' || true
            docker exec zaentrum sh -c '
              df -T /var/lib/rancher/k3s/agent/containerd /var/lib/kubelet/pods/$1/volumes/kubernetes.io~empty-dir/* 2>/dev/null ||
                df /var/lib/rancher/k3s/agent/containerd /var/lib/kubelet/pods/$1/volumes/kubernetes.io~empty-dir/* 2>/dev/null
              grep -E " (/|/var/lib/rancher[^ ]*|/var/lib/kubelet[^ ]*) " /proc/mounts' sh "$uid" || true
            echo "::endgroup::"
          fi
          docker logs zaentrum --tail 40 || true
