apiVersion: v1
kind: Namespace
metadata:
  name: zaentrum-operator-system
  labels:
    app.kubernetes.io/part-of: zaentrum-operator
    control-plane: controller-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
  labels:
    app.kubernetes.io/part-of: zaentrum-operator
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: zaentrum-operator-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/zaentrum/operator:latest
          command: ["/manager"]
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
          # The operator reports its OWN controller in status.controller. It
          # learns what it runs by reading the pod it is in — never from a
          # version stamped into the binary at build time, which is a claim
          # about the past and goes stale the moment someone repoints the tag.
          # The appliance render adds ZAENTRUM_INSTALL_SOURCE=appliance here
          # (deploy/allinone/build.sh); a plain apply of these manifests is
          # derived as "manifest", and an OLM install as "olm", from the
          # ClusterServiceVersion that owns the Deployment.
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
