# The operator's ServiceAccount carries NO imagePullSecrets, on purpose, and
# must never be given one by hand. Its image is public. GHCR answers a dead or
# expired credential with 403 instead of falling back to anonymous, so a
# hand-attached pull secret that later expires makes the operator unpullable —
# which is exactly what happened on 2026-08-11: 23 days of ImagePullBackOff,
# nothing reconciling, while the CR kept the phase of its last reconcile. The
# deploy pipeline's operator preflight checks for this state. (Kustomize drops
# comments, so this note lives here, in the source, not in the rendered
# install manifest.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zaentrum-operator-controller-manager
  namespace: zaentrum-operator-system
