# zaentrum platform — self-host defaults. Each field maps 1:1 onto a Zaentrum CR
# spec field (the operator builds these values from the CR). Defaults reproduce a
# plain single-node self-host; the demo overrides them in values-demo.yaml.

global:
  # Image tag applied to every ghcr.io/zaentrum/* image (CR spec.version / channel).
  version: latest
  # Public host: OIDC issuer host + ingress host + KC_HOSTNAME.
  hostname: zaentrum.localhost
  # app.kubernetes.io/part-of label value.
  partOf: zaentrum
  # Pull secrets added to every workload (empty for public ghcr).
  imagePullSecrets: []

identity:
  mode: bundled            # bundled (ship Keycloak) | external (federate)
  issuer: ""               # explicit issuer URL; empty → derived from scheme+hostname
  issuerScheme: http       # http | https  (the demo terminates TLS at the edge → https)
  clientId: chino-web
  # The public clients the TV apps (the device grant with PKCE) and the phone
  # and tablet apps (the authorization code with PKCE, returning to
  # cloud.nalet.chino:/oauth/callback) sign in through; chino-api advertises
  # them in /api/config. Empty: the bundled realm's chino-tv and chino-mobile,
  # or with an external provider chino-api's default, "chino".
  tvClientId: ""
  mobileClientId: ""
  audience: chino
  loginTheme: ""           # bundled Keycloak login theme name (demo: zaentrum)
  # The bundled Keycloak's admin console and admin API on the public host
  # (/auth/admin). false: the host routes only /auth/realms and /auth/resources,
  # and the console answers through a port-forward only —
  #   kubectl port-forward svc/keycloak 8080:80   → http://localhost:8080/auth/admin/
  exposeAdminConsole: false

features:
  kafka: true              # bundled single-node KRaft broker (ignored when eventStreaming.mode=external)
  gpu: false               # NVENC on the stream/transcoder plane
  pipeline: false          # analyzer/packager/transcoder/katalog-ingest media pipeline

# How the media pipeline (features.pipeline) encodes and packages. Empty values
# leave each worker's own default.
pipeline:
  # gpu: NVENC — the transcoder asks for nvidia.com/gpu and runs on a node with
  # an NVIDIA GPU. cpu: libx264/libx265 on any node, no GPU. Either way HEVC
  # every device decodes (Main or Main 10, 4:2:0, up to 10-bit) is copied; on cpu
  # a browser-friendly H.264 is copied too, unless ladder is "source:hevc".
  encoder: gpu
  ladder: ""               # extra renditions, e.g. "source,720p" (LADDER); "source:hevc": HEVC only; empty: one per title
  segmentSeconds: 0        # HLS segment length 1..30 (SEGMENT_SECONDS); 0: the workers' 6
  surroundAudio: ""        # off | eac3 | ac3 — a 5.1 rendition per surround track; empty: off
  hlsSubtitles: false      # name the WebVTT renditions in the HLS master
  preferredLanguages: []   # default audio language order, e.g. [de, en]; empty: the catalog's list

storage:
  mediaSize: 50Gi
  className: ""             # optional StorageClass for platform PVCs
  mediaAccessMode: ReadWriteOnce   # the media PVC's access mode: ReadWriteOnce (one node, local-path) | ReadWriteMany (shared storage)
  provisionMedia: true      # false → an external PV backs the `media` PVC (demo NFS); chart skips the PVC
  kafkaPvc: ""              # name of a pre-created PVC for kafka's log dir (topics survive restart); "" → emptyDir
  kafkaNode: ""             # kubernetes.io/hostname to pin kafka to (needed for a node-local kafkaPvc); "" → unpinned
  # The bundled Postgres (databases.mode perApp or single) keeps users, watch
  # state and the catalog on a claim.
  postgres:
    size: 10Gi
    className: ""           # empty: storage.className, else the cluster's default
    claimName: ""           # an existing claim; empty: the chart provisions postgres-data
    # Where the running Postgres's data is when it is not on that claim yet:
    # "emptyDir" (an install from before the chart kept it on a claim) or another
    # claim's name. Empty: Helm looks at the running Postgres and keeps it where
    # it is — a Postgres started on a new volume starts empty — and a new install
    # starts on the claim. The operator always says.
    current: ""
    # Copy the databases from where they are onto the claim (a post-upgrade
    # hook, templates/postgres-migrate.yaml); the Postgres stays where it is.
    # Once the copy has succeeded, switch it with current set to the claim's
    # name (postgres-data), migrate false. The operator does both itself
    # (spec.storage.postgres.migrate).
    migrate: false

# Backups of the bundled Postgres (templates/backup.yaml): a CronJob dumps every
# platform database (databases.*) into the claim backups, with a checksum of
# each file, and keeps the newest `retention` dumps.
backup:
  enabled: null            # null: on wherever the bundled Postgres keeps its data on a claim
  schedule: "@daily"
  retention: 7
  size: 5Gi
  className: ""            # empty: the Postgres's (storage.postgres.className, else storage.className)
  claimName: ""            # an existing claim to keep the dumps on; empty: the chart provisions `backups`
  # A dump's name, e.g. 2026-10-04T00-00-05Z: stop every client of the
  # database and restore it (templates/postgres-restore.yaml, a post-upgrade
  # hook). Upgrade again without it to start them. The operator does both for
  # the annotation zaentrum.io/restore-request.
  restore: ""

# Event streaming: the bundled broker, or a shared external cluster (per-tenant
# topic prefix + mTLS). External mode skips the bundled kafka entirely.
eventStreaming:
  mode: bundled             # bundled | external
  bootstrap: ""             # external: bootstrap servers, e.g. platform-kafka-kafka-bootstrap.platform-event-streaming.svc:9093
  certSecret: ""            # external: secret in THIS namespace with user.crt/user.key/ca.crt (a copied KafkaUser secret); "" → plaintext
  topicPrefix: "stube."     # per-tenant topic namespace on a shared cluster (e.g. "zaentrum-beta.")

network:
  # Split-horizon: adds hostAliases (this IP → global.hostname) to the OIDC
  # validators so in-cluster token validation reaches the public HTTPS issuer.
  issuerHostAliasIP: ""

# The platform's own certificate (templates/certificate.yaml, the Ingress's tls,
# the Routes' edge): with tls.enabled every URL the platform derives is https.
tls:
  enabled: false
  secretName: ""            # a kubernetes.io/tls Secret (tls.crt, tls.key); empty: zaentrum-tls
  # A cert-manager issuer to sign a Certificate for the hosts into that Secret
  # (needs cert-manager's CRDs); empty name: bring the Secret yourself.
  issuerRef:
    name: ""
    kind: ""                # Issuer (default) | ClusterIssuer
    group: ""               # default cert-manager.io
  # The Routes carry their certificate inline. Empty: read from the Secret
  # (lookup, under helm install/upgrade); the operator always passes them.
  certificate: ""
  key: ""
  caCertificate: ""

routing:
  provisionIngress: true    # plain-k8s Ingress (single-origin paths)
  provisionRoutes: false    # OpenShift Routes (demo)
  # pathRouted = everything on global.hostname (profile B1, the demo).
  # subdomains = chino gets its OWN host (hosts.chino) serving the SPA at /
  #              (+ /api, /stream there); the platform surfaces stay on
  #              global.hostname. Requires DNS + TLS for the extra host.
  mode: pathRouted          # pathRouted | subdomains
  hosts:
    chino: ""               # subdomains: e.g. chino.example.com

secrets:
  external: false           # true → secrets are pre-created (CI/demo); chart skips rendering them

jobs:
  seed: false               # seed/scan/enqueue self-populate Jobs (demo content bootstrap)

databases:
  mode: perApp              # perApp (bundled, DB per service) | single | external (shared cluster)
  chino: chino
  katalog: katalog
  keycloak: keycloak
  portal: portal
  # external mode: the shared HA Postgres — the chart skips the bundled postgres
  # + create-db initContainers (DB provisioning is the tenant's job); the db
  # names above then name databases ON the shared cluster (e.g. chino_beta).
  external:
    host: ""                # e.g. postgres.example.com
    port: 5432
    sslmode: require

keycloak:
  image: quay.io/keycloak/keycloak:26.0.7

# The platform's self-test: templates/tests/verify.yaml, a chart test (`helm
# test`). The operator runs it after every update and on request and reports it
# in status.verification. `zae doctor` checks the public URL outside-in and signs
# in with the account in Secret zaentrum-verify.
verification:
  enabled: true

# Per-service replica overrides (CR spec.replicas). Unlisted services render 1.
services:
  packager:
    replicas: 2
