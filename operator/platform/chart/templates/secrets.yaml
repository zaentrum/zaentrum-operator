{{/*
Bundled DEV-default secrets for a self-host / appliance install. Skipped when
secrets.external=true (the demo, where CI creates the real secrets from DEMO_*
vars). Deterministic values (no randAlphaNum) so re-renders don't churn SSA —
CHANGE THEM for anything real.
*/}}
{{- if not .Values.secrets.external }}
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-db
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  user: zaentrum
  password: zaentrum-dev-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-stream-signing
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  key: ZGV2LW9ubHktY2hhbmdlLW1lLXN0cmVhbS1zaWduaW5nLWtleQ==
{{- if eq .Values.identity.mode "bundled" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-keycloak
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  client-secret: zaentrum-manager-dev-change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-keycloak-admin
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  username: admin
  password: dev-change-me
  realm-admin-password: dev-change-me
{{- end }}
{{- end }}
