{{/*
The platform's Secrets for a plain Helm install, when nobody provides them
(secrets.external). Every value is random on the first install and read back
from the cluster on each upgrade (lookup), so no upgrade rotates one and no two
installs share one.

The operator never renders these: it makes each Secret once itself and owns it
(internal/controller/secrets.go), and renders this chart with secrets.external.
`helm template` has no cluster to read back from, so piped into kubectl it makes
new values on every run — there, create the Secrets yourself and set
secrets.external.
*/}}
{{- if not .Values.secrets.external }}
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-db
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  user: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-db" "key" "user" "value" "zaentrum") | quote }}
  password: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-db" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-stream-signing
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  # base64, as chino-api, chino-stream and katalog-manager read it: 32 bytes.
  key: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-stream-signing" "key" "key" "value" (randAlphaNum 32 | b64enc)) | quote }}
{{- if eq .Values.identity.mode "bundled" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-keycloak
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  # The zaentrum-manager client's secret (the realm import's ${ZAENTRUM_MANAGER_SECRET}).
  client-secret: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-keycloak" "key" "client-secret") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-keycloak-admin
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  # The master realm's bootstrap admin.
  username: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-keycloak-admin" "key" "username" "value" "admin") | quote }}
  password: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-keycloak-admin" "key" "password") | quote }}
  # The first administrator's one-time password (the realm import's
  # ${ZAENTRUM_ADMIN_PASSWORD}, temporary): a new one is chosen at the first
  # sign-in. NOTES.txt says how to read it.
  realm-admin-password: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-keycloak-admin" "key" "realm-admin-password" "length" 24) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-demo-user
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  # The realm import's ${DEMO_USER_PASSWORD}. Keycloak leaves a placeholder it
  # cannot resolve as it is: without this the demo user's password would be
  # the literal "${DEMO_USER_PASSWORD}".
  password: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-demo-user" "key" "password") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zaentrum-people
  labels:
    app.kubernetes.io/part-of: {{ .Values.global.partOf }}
type: Opaque
stringData:
  # The zaentrum-people client's secret: the realm Job sets it in the realm,
  # portal-api signs in with it to manage the realm's people (the People page).
  client-secret: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-people" "key" "client-secret") | quote }}
  # What chino-api and portal-api show each other to delete a person's
  # account and their data.
  deletion-token: {{ include "z.secretValue" (dict "root" . "secret" "zaentrum-people" "key" "deletion-token" "length" 43) | quote }}
{{- end }}
{{- end }}
