{{- if .Values.routing.provisionIngress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zaentrum
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "14400"
spec:
{{- if .Values.tls.enabled }}
  # The platform's certificate (tls.secretName). What becomes of plain http
  # for the host is the ingress controller's to say: a redirect, or nothing.
  tls:
    - hosts: [{{ .Values.global.hostname | quote }}]
      secretName: {{ include "z.tlsSecret" . }}
{{- end }}
  rules:
    - host: {{ .Values.global.hostname }}
      http:
        paths:
          - path: /api/manage
            pathType: Prefix
            backend:
              service:
                name: katalog-manager-api
                port:
                  number: 80
          - path: /api/portal
            pathType: Prefix
            backend:
              service:
                name: portal-api
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chino-api
                port:
                  number: 80
          - path: /katalog-manage
            pathType: Prefix
            backend:
              service:
                name: katalog-manage-ui
                port:
                  number: 80
          - path: /katalog
            pathType: Prefix
            backend:
              service:
                name: katalog-manager-ui
                port:
                  number: 80
          - path: /chino
            pathType: Prefix
            backend:
              service:
                name: chino-web
                port:
                  number: 80
          - path: /portal
            pathType: Prefix
            backend:
              service:
                name: zaentrum-portal
                port:
                  number: 80
          # Bundled Keycloak: only what people sign in through — the login and
          # account pages and the OIDC endpoints, and their styles and scripts.
          # The admin console (/auth/admin) answers through a port-forward,
          # unless identity.exposeAdminConsole publishes /auth whole.
{{- range (ternary (list "/auth") (list "/auth/realms" "/auth/resources") .Values.identity.exposeAdminConsole) }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
{{- end }}
          # chino-web returns from a sign-in to the site root's /auth/callback
          # (z.realmClients): more specific than /auth, so it reaches the SPA
          # rather than Keycloak, as the Routes' auth-callback route does.
          - path: /auth/callback
            pathType: Prefix
            backend:
              service:
                name: chino-web
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zaentrum-portal
                port:
                  number: 80
{{- end }}

{{- if and .Values.routing.provisionIngress (eq .Values.routing.mode "subdomains") .Values.routing.hosts.chino }}
# ── chino subdomain (routing.mode=subdomains) — Ingress flavor. ──
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chino-subdomain
  labels: { app: chino-web, app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
spec:
{{- if .Values.tls.enabled }}
  tls:
    - hosts: [{{ .Values.routing.hosts.chino | quote }}]
      secretName: {{ include "z.tlsSecret" . }}
{{- end }}
  rules:
    - host: {{ .Values.routing.hosts.chino }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chino-api
                port: { name: http }
          - path: /auth/callback
            pathType: Prefix
            backend:
              service:
                name: chino-web
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chino-web
                port: { name: http }
{{- end }}
