{{- if eq .Values.identity.mode "bundled" }}
# ── zaentrum realm import ───────────────────────────────────────────────────
# Mounted into Keycloak at /opt/keycloak/data/import and ingested with
# --import-realm on first boot. This ConfigMap is the single source of truth
# for the realm/client/role contract; the keycloak image carries no realm.
#
# ${ZAENTRUM_MANAGER_SECRET} and ${ZAENTRUM_ADMIN_PASSWORD} are substituted by
# Keycloak from the env vars of the same name (sourced from the
# zaentrum-keycloak / zaentrum-keycloak-admin Secrets) at import time, so
# neither the confidential service-account secret nor the realm-admin password
# lives in this manifest.
#
# The clients people sign in through allow exactly the platform's own redirect
# URIs, web origins and post-logout redirect URIs (z.realmClients, derived from
# global.hostname and the routing); files/keycloak-realm.json leaves them empty.
# An import only ever makes a new realm, so the realm Job (realm.yaml) writes
# the same values into one that already exists.
{{- $realm := .Files.Get "files/keycloak-realm.json" | fromJson }}
{{- $want := include "z.realmClients" . | fromJson }}
{{- range $client := $realm.clients }}
{{- with index $want $client.clientId }}
{{- $_ := set $client "redirectUris" .redirectUris }}
{{- $_ := set $client "webOrigins" .webOrigins }}
{{- if not $client.attributes }}{{ $_ := set $client "attributes" dict }}{{ end }}
{{- range $k, $v := .attributes }}{{ $_ := set $client.attributes $k $v }}{{ end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels: { app: keycloak, app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
data:
  zaentrum-realm.json: |
{{ toPrettyJson $realm | indent 4 }}
{{- end }}
