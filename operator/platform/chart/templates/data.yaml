{{- if ne .Values.databases.mode "external" }}
{{- $volume := include "z.postgresVolume" . }}
{{- $claim := include "z.postgresClaim" . }}
# The bundled Postgres keeps users, watch state and the catalog on a claim
# (storage.postgres), so they outlive the pod. An install from before that runs
# it on an emptyDir, which a reschedule empties; it stays there until a copy
# moves it (z.postgresVolume, postgres-migrate.yaml), since a Postgres started on
# a new volume starts empty.
# OKD restricted-v2 runs an arbitrary high UID, so PGDATA is a subdir the
# container creates+owns (the chino-wunsch postgres proves this pattern).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  labels: { app: postgres, app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
data:
  # Runs once on first init (PGDATA empty). POSTGRES_DB already made 'zaentrum';
  # create the per-app DBs the demo services + bundled Keycloak expect.
  10-create-dbs.sql: |
    CREATE DATABASE {{ .Values.databases.chino }};
    CREATE DATABASE {{ .Values.databases.katalog }};
    CREATE DATABASE {{ .Values.databases.keycloak }};
    CREATE DATABASE {{ .Values.databases.portal }};
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres, app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
spec:
  replicas: {{ include "z.replicas" (dict "root" $ "name" "postgres" "def" 1) }}
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres } }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: zaentrum-db, key: user } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: zaentrum-db, key: password } }
            - name: POSTGRES_DB
              value: zaentrum
            # Subdir the container creates+owns (restricted-v2 arbitrary UID).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "zaentrum"] }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
{{- if eq $volume "emptyDir" }}
          emptyDir: { sizeLimit: 5Gi }     # lost whenever the pod moves
{{- else }}
          persistentVolumeClaim: { claimName: {{ $volume }} }
{{- end }}
        - name: initdb
          configMap: { name: postgres-initdb }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
{{- if and (not .Values.storage.postgres.claimName) (or (eq $volume $claim) .Values.storage.postgres.migrate) }}
---
# The claim the chart provisions, when it is the one the data lives on or is
# copied onto; one an install brings (storage.postgres.claimName) is its own.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claim }}
  labels: { app: postgres, app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
spec:
  # One Postgres mounts it (the Deployment's strategy is Recreate).
  accessModes: [ReadWriteOnce]
{{- with (.Values.storage.postgres.className | default .Values.storage.className) }}
  storageClassName: {{ . | quote }}
{{- end }}
  resources: { requests: { storage: {{ .Values.storage.postgres.size | default "10Gi" | quote }} } }
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: { app: valkey, app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
spec:
  replicas: {{ include "z.replicas" (dict "root" $ "name" "valkey" "def" 1) }}
  selector: { matchLabels: { app: valkey } }
  template:
    metadata: { labels: { app: valkey } }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports: [{ containerPort: 6379, name: valkey }]
          readinessProbe:
            tcpSocket: { port: valkey }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels: { app: valkey }
spec:
  selector: { app: valkey }
  ports: [{ name: valkey, port: 6379, targetPort: valkey }]
