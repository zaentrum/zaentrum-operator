{{- if .Values.storage.provisionMedia }}
# The media library's claim, provisioned by the cluster's default StorageClass
# (or storage.className). An install whose library lives on a volume of its own
# — the demo's and beta's NFS exports — sets provisionMedia false and brings the
# claim itself; the chart then renders none.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "z.mediaClaimName" . }}
  labels: { app.kubernetes.io/part-of: {{ .Values.global.partOf }} }
spec:
  # One volume for the library, mounted by every pod that reads or writes it.
  # ReadWriteOnce keeps those pods on the volume's node (local-path, one node);
  # ReadWriteMany is for storage that shares a volume across nodes.
  accessModes: [{{ .Values.storage.mediaAccessMode | default "ReadWriteOnce" }}]
{{- with .Values.storage.className }}
  storageClassName: {{ . | quote }}
{{- end }}
  resources: { requests: { storage: {{ .Values.storage.mediaSize }} } }
{{- end }}
