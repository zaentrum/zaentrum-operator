# The password reset mail in the platform's words: its subject, its plain
# text and its HTML, which the parent theme's password-reset templates fill in
# as msg(key, link, linkExpiration, realmName, linkExpirationFormatter(...)):
# the link as {0}, and the realm's time for it, as Keycloak words it ("5
# minutes"), as {3}. Laid out as email/messages/messages_en.properties.
# Java's MessageFormat reads them: no single quote, and no brace but {0} and {3}.
passwordResetSubject=Reset your password
passwordResetBody=Somebody asked to reset the password of your account.\n\nIf it was you, open this link and choose a new password:\n\n{0}\n\nThe link works for {3}.\n\nIf it was not you, ignore this mail. Your password stays as it is.
passwordResetBodyHtml=<p>Somebody asked to reset the password of your account.</p><p>If it was you, open this link and choose a new password:</p><p><a href="{0}">{0}</a></p><p>The link works for {3}.</p><p>If it was not you, ignore this mail. Your password stays as it is.</p>
