    name: packager
    namespace: zaentrum-demo
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: packager
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
      type: RollingUpdate
    template:
      metadata:
        labels:
          app: packager
          app.kubernetes.io/part-of: zaentrum-demo
          component: pipeline
          plane: worker
      spec:
        containers:
        - env:
          - name: KATALOG_API_URL
