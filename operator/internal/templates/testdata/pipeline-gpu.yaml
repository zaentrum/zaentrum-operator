- apiVersion: apps/v1
  kind: Deployment
  metadata:
    labels:
      app: analyzer
      app.kubernetes.io/part-of: zaentrum-demo
      component: pipeline
      plane: worker
    name: analyzer
    namespace: zaentrum-demo
  spec:
    replicas: 1
    revisionHistoryLimit: 10
    selector:
      matchLabels:
        app: analyzer
    strategy:
      type: Recreate
    template:
      metadata:
        labels:
          app: analyzer
          app.kubernetes.io/part-of: zaentrum-demo
          component: pipeline
          plane: worker
      spec:
        containers:
        - env:
          - name: KATALOG_API_URL
            value: http://katalog-manager-api
          - name: OIDC_TOKEN_URL
            value: http://keycloak/auth/realms/zaentrum/protocol/openid-connect/token
          - name: OIDC_CLIENT_ID
            value: zaentrum-manager
          - name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                key: client-secret
                name: zaentrum-keycloak
          - name: KAFKA_BROKERS
            value: kafka:9092
          - name: KAFKA_TOPIC_PREFIX
            value: stube.
          - name: KAFKA_GROUP_ID
            value: analyzer-workers
          - name: CONSUME_TOPIC
            value: stube.catalog.item.enriched
          - name: PRODUCE_TOPIC
            value: stube.catalog.item.analyzed
          - name: CLAIM_BATCH_SIZE
            value: "2"
          - name: IDLE_SLEEP_SECONDS
            value: "20"
          - name: TIDB_FIRST_CLAIM_INTERVAL_SECONDS
            value: "0.25"
          - name: TIDB_FIRST_BATCH_SIZE
            value: "4"
          - name: ENABLE_WHISPER
            value: "false"
          image: ghcr.io/zaentrum/analyzer:latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          name: app
          ports:
          - containerPort: 8080
            name: http
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 15
            successThreshold: 1
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
          - mountPath: /var/lib/katalog
            name: katalog-data
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
        volumes:
        - name: katalog-data
          persistentVolumeClaim:
            claimName: media
- apiVersion: apps/v1
