apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      {{- with .Values.zaentrum.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: worker
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GREETING
              value: {{ .Values.greeting | quote }}
            - name: OIDC_ISSUER
              value: {{ .Values.zaentrum.issuer | quote }}
            - name: EVENT_BROKERS
              value: {{ .Values.zaentrum.events.brokers | quote }}
            - name: API_TOKEN
              valueFrom:
                secretKeyRef: { name: worker, key: token }
            - name: SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: worker, key: signingKey }
          volumeMounts:
            - name: media
              mountPath: /media
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.zaentrum.media.claimName }}
